// A bounded interaction metaphor for Lenz's law, not a field simulation.
// A Gaussian represents coupling; -d(flux)/dt changes sign on approach/departure.
function inductionTarget(center, pointer, now, { radius=190, limit=16, enabled=true }={}) {
  const idle={x:0,y:0,strength:0,phase:'idle'};
  if(!enabled||!pointer.active||!Number.isFinite(pointer.time))return idle;
  const age=Math.max(0,now-pointer.time);
  if(age>650)return idle;
  const dx=pointer.x-center.x,dy=pointer.y-center.y,d=Math.hypot(dx,dy);
  if(d<2||d>radius*2.6)return idle;
  const coupling=Math.exp(-(d*d)/(2*radius*radius));
  const radial=(dx*(pointer.vx||0)+dy*(pointer.vy||0))/d;
  const decay=Math.exp(-Math.max(0,age-35)/85);
  const response=Math.tanh(radial*coupling/230)*decay;
  if(Math.abs(response)<.012)return idle;
  return {x:dx/d*response*limit,y:dy/d*response*limit,strength:Math.abs(response),phase:response<0?'approach':'depart'};
}

  const technologyLink=document.querySelector('.technology');technologyLink.href='/#knowledge';
  window.addEventListener('message',event=>{
    if(event.source!==window.parent||event.origin!==location.origin||event.data?.type!=='cimai:public-home-context')return;
    const records=Array.isArray(event.data.articles)?event.data.articles.filter(item=>Number.isSafeInteger(item.id)&&item.id>0&&typeof item.title==='string'):[];
    for(const topic of topics){const match=records.find(item=>publicArticleTerms[topic.id].some(term=>item.title.includes(term)));topic.article=match?.id||null;}
    const about=records.find(item=>item.title.includes('关于磁脉'));
    technologyLink.href=about?`/#article/${about.id}`:'/#knowledge';
    if(activeId)showInsight(byId.get(activeId));
  });
  document.addEventListener('keydown',event=>{
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&window.parent!==window){event.preventDefault();window.parent.postMessage({type:'cimai:home-search'},location.origin);}
  });
  document.querySelector('[data-home-theme]').addEventListener('click',()=>window.parent.postMessage({type:'cimai:home-theme'},location.origin));

  stage.dataset.power='idle';cachePositions();resetInsight();renderPower(performance.now());syncMotion();document.fonts?.ready.then(()=>{cachePositions();if(canAnimate())startPower();});
})();

</script>
</body>
</html>
